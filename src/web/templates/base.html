<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sales Agent{% endblock %} · Sales Agent</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/profiles">Sales Agent</a>
      <nav>
        <a href="/profiles" {% if request.url.path.startswith('/profiles') %}aria-current="page"{% endif %}>Profiles</a>
        <a href="/runs" {% if request.url.path.startswith('/runs') %}aria-current="page"{% endif %}>Runs</a>
        <a href="/review" {% if request.url.path.startswith('/review') or request.url.path.startswith('/memos') %}aria-current="page"{% endif %}>Review</a>
        <a href="/outreach" {% if request.url.path.startswith('/outreach') or request.url.path.startswith('/drafts') %}aria-current="page"{% endif %}>Outreach</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Forms with data-confirm ask first. The message is read from the
    // attribute (HTML-escaped by the template) and never built into script
    // text, so names from the web can't inject code here.
    document.addEventListener("submit", function (event) {
      var message = event.target.dataset && event.target.dataset.confirm;
      if (message && !window.confirm(message)) event.preventDefault();
    });
  </script>
</body>
</html>
