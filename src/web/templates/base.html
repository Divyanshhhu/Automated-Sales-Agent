<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sales Agent{% endblock %} · Sales Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  <script src="/static/htmx.min.js?v={{ asset_version }}" defer></script>
</head>
<body>
  {% set path = request.url.path %}
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">Sales Agent</a>
      <nav aria-label="Main">
        <a href="/" {% if path == '/' or path.startswith('/runs') %}aria-current="page"{% endif %}>Home</a>
        <a href="/leads" {% if path.startswith('/leads') or path.startswith('/drafts') or path.startswith('/outreach') %}aria-current="page"{% endif %}>Leads</a>
        <a href="/profiles" {% if path.startswith('/profiles') %}aria-current="page"{% endif %}>Campaigns</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Forms with data-confirm ask first. The message is read from the
    // attribute (HTML-escaped by the template) and never built into script
    // text, so names from the web can't inject code here.
    document.addEventListener("submit", function (event) {
      var message = event.target.dataset && event.target.dataset.confirm;
      if (message && !window.confirm(message)) event.preventDefault();
    });

    // Dropdown menus (<details class="menu">) close when you click anywhere else.
    document.addEventListener("click", function (event) {
      document.querySelectorAll("details.menu[open]").forEach(function (menu) {
        if (!menu.contains(event.target)) menu.removeAttribute("open");
      });
    });

    // Keyboard shortcuts: any element with data-shortcut="a" is clicked when
    // that key is pressed -- unless you're typing in a field.
    document.addEventListener("keydown", function (event) {
      if (event.ctrlKey || event.metaKey || event.altKey || event.defaultPrevented) return;
      if (!/^[a-z]$/i.test(event.key)) return;
      var tag = (event.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select" || event.target.isContentEditable) return;
      var target = document.querySelector('[data-shortcut="' + event.key.toLowerCase() + '"]');
      if (target) { event.preventDefault(); target.click(); }
    });
  </script>
</body>
</html>
